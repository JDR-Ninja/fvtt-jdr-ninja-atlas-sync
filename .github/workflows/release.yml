# Publishes a release when you push a tag like v0.2.0.
# For the future standalone public repo — harmless here (this path won't run as a
# workflow until the module lives in its own repo at the root).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Verify tag matches module.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./module.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG != module.json version $VER"
            exit 1
          fi

      - run: npm run build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
